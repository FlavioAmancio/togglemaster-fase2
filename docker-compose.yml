services:
  # ==========================================
  # BANCOS DE DADOS E CACHE (4 containers)
  # ==========================================
  
  # 1. Postgres para Auth
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Postgres para Flags e Targeting
  postgres-app:
    image: postgres:15-alpine
    container_name: postgres-app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./init-app-dbs.sh:/docker-entrypoint-initdb.d/init-app-dbs.sh
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/flag-init.sql
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/targeting-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. DynamoDB Local
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "8000:8000"

  # ==========================================
  # MICROSSERVIÇOS (5 containers)
  # ==========================================

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres-auth:5432/auth_db?sslmode=disable"
      MASTER_KEY: "admin-secreto-123"
    depends_on:
      postgres-auth:
        condition: service_healthy

  flag-service:
    build:
      context: ./flag-service
      dockerfile: Dockerfile
    container_name: flag-service
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres-app:5432/flags_db"
      AUTH_SERVICE_URL: "http://auth-service:8001"
    depends_on:
      postgres-app:
        condition: service_healthy
      auth-service:
        condition: service_started

  targeting-service:
    build:
      context: ./targeting-service
      dockerfile: Dockerfile
    container_name: targeting-service
    ports:
      - "8003:8003"
    environment:
      PORT: "8003"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres-app:5432/targeting_db"
      AUTH_SERVICE_URL: "http://auth-service:8001"
    depends_on:
      postgres-app:
        condition: service_healthy
      auth-service:
        condition: service_started

  evaluation-service:
    build:
      context: ./evaluation-service
      dockerfile: Dockerfile
    container_name: evaluation-service
    ports:
      - "8004:8004"
    environment:
      PORT: "8004"
      REDIS_URL: "redis://redis:6379"
      FLAG_SERVICE_URL: "http://flag-service:8002"
      TARGETING_SERVICE_URL: "http://targeting-service:8003"
      SERVICE_API_KEY: "admin-secreto-123"
      AWS_SQS_URL: "http://sqs-local-placeholder/queue"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "mock_key_local"
      AWS_SECRET_ACCESS_KEY: "mock_secret_local"
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    ports:
      - "8005:8005"
    environment:
      PORT: "8005"
      AWS_SQS_URL: "http://sqs-local-placeholder/queue"
      AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
      AWS_ENDPOINT_URL: "http://dynamodb-local:8000"
      AWS_DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "mock_key_local"
      AWS_SECRET_ACCESS_KEY: "mock_secret_local"
    depends_on:
      - dynamodb-local